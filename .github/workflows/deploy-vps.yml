name: Build and Deploy Spring Boot

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bangtu21/spring-deploy-demo:latest

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Deploy application through SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull ghcr.io/bangtu21/spring-deploy-demo:latest

            docker stop spring-deploy-demo || true
            docker rm spring-deploy-demo || true

            docker run -d \
              --name spring-deploy-demo \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/bangtu21/spring-deploy-demo:latest

            docker ps
            docker logs --tail 50 spring-deploy-demo